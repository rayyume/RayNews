services:
  raynews:
    # 🧪 本地测试：用 build: . 构建本地镜像（基于当前代码）
    # 🚀 生产部署：注释掉 build 行，取消注释 image 行（拉取正式版本）
    # 🟡 Beta 测试：拉取 ghcr.io/rayyume/raynews:vX.Y.Z-beta.N
    build: .
    # image: ghcr.io/rayyume/raynews:latest
    container_name: raynews
    ports:
      - "8090:80"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/data
      - RAYNEWS_SECRET=${RAYNEWS_SECRET:-}
      - RAYNEWS_TOKEN_EXPIRY_SECONDS=${RAYNEWS_TOKEN_EXPIRY_SECONDS:-2592000}
      - AUTO_SUMMARY_BATCH_LIMIT=${AUTO_SUMMARY_BATCH_LIMIT:-20}
      - AUTO_SUMMARY_INTERVAL_SECONDS=${AUTO_SUMMARY_INTERVAL_SECONDS:-30}
      - AI_REQUEST_TIMEOUT_SECONDS=${AI_REQUEST_TIMEOUT_SECONDS:-300}
      - AUTO_TRANSLATION_BATCH_LIMIT=${AUTO_TRANSLATION_BATCH_LIMIT:-5}
      - AUTO_TRANSLATION_INTERVAL_SECONDS=${AUTO_TRANSLATION_INTERVAL_SECONDS:-30}
      - AUTO_SOURCE_CLASSIFY_BATCH_LIMIT=${AUTO_SOURCE_CLASSIFY_BATCH_LIMIT:-20}
      - AUTO_SOURCE_CLASSIFY_INTERVAL_SECONDS=${AUTO_SOURCE_CLASSIFY_INTERVAL_SECONDS:-120}
      - RAYNEWS_PUBLIC_URL=${RAYNEWS_PUBLIC_URL:-https://news.rayyu.me}
      - CUSTOM_HEAD_HTML=${CUSTOM_HEAD_HTML:-}
      # Telegram 频道（需配合 BroadcastChannel 使用）
      - TELEGRAM_CHANNEL=${TELEGRAM_CHANNEL:-your_channel}
      # 代理配置（通过 .env 注入，按需）
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
    # extra_hosts 按需在 .env 中配置，默认注释
    # extra_hosts:
    #  - "host.docker.internal:${HOST_IP:-}"
    restart: unless-stopped
