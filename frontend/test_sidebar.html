<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RayNews - 侧栏测试</title>
<style>
:root {
  --bg: #0a0a0c;
  --bg-card: #111114;
  --bg-card-hover: #16161a;
  --bg-surface: #1a1a1f;
  --text: #e8e8ed;
  --text-2: #8b8b9e;
  --text-3: #55556a;
  --accent: #6e8efb;
  --accent-dim: rgba(110,142,251,0.12);
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(255,255,255,0.12);
  --radius: 12px;
  --font: "SF Pro Display",-apple-system,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}

/* Layout */
.app{max-width:960px;margin:0 auto;padding:0 20px}

/* Header */
.header{position:sticky;top:0;z-index:100;background:rgba(10,10,12,0.82);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);margin:0 -20px;padding:0 20px}
.header-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;cursor:pointer}
.logo-icon{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),#a78bfa);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff}
.header-right{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--text-3)}
.status-dot{width:6px;height:6px;background:#22c55e;border-radius:50%;display:inline-block;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* Sidebar */
.sidebar-toggle{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:50;width:24px;height:48px;background:var(--bg-card);border:1px solid var(--border);border-left:none;border-radius:0 8px 8px 0;color:var(--text-3);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;padding:0}
.sidebar-toggle:hover{background:var(--bg-card-hover);color:var(--accent)}
.sidebar-toggle.open{left:200px}
.sidebar{position:fixed;left:0;top:56px;bottom:0;z-index:40;width:200px;background:var(--bg-card);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);overflow-y:auto;padding:16px 12px}
.sidebar.open{transform:translateX(0);box-shadow:4px 0 20px rgba(0,0,0,0.3)}
.sidebar-header{font-size:12px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.sidebar .filters{display:flex;flex-direction:column;gap:4px;padding:0;overflow:visible}

/* Category headers - All and category names share identical styling */
.cat-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;margin:2px 0;border-radius:6px;font-size:12px;font-weight:700;color:var(--text-3);cursor:pointer;transition:all 0.12s;user-select:none;letter-spacing:0.03em}
.cat-header:hover{color:var(--text-2);background:var(--bg-card-hover)}
.cat-header .arrow{font-size:10px;transition:transform 0.2s;color:var(--text-3);display:inline-block;width:10px;text-align:center}
.cat-header .arrow.open{transform:rotate(90deg)}
.cat-header.active{background:var(--accent-dim);color:var(--accent)}
.cat-header.active .arrow{color:var(--accent)}

/* Category body - subscription source buttons */
.cat-body{display:flex;flex-direction:column;gap:2px}
.cat-body.collapsed{display:none}
.sidebar .fbtn{width:100%;text-align:left;padding:7px 12px 7px 24px;border-radius:6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;background:transparent;color:var(--text-2);cursor:pointer;transition:all 0.12s;font-family:var(--font)}
.sidebar .fbtn:hover{background:var(--bg-card-hover);color:var(--text)}
.sidebar .fbtn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}

/* News list */
.list{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:40px;margin-top:16px}
.item{display:flex;gap:16px;padding:18px 20px;background:var(--bg-card);cursor:pointer;transition:background 0.12s}
.item:hover{background:var(--bg-card-hover)}
.item-title{font-size:15px;font-weight:600;line-height:1.45;color:var(--text)}
.item-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text-3);margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;font-weight:700;font-size:10px;letter-spacing:0.04em;background:var(--accent-dim);color:var(--accent)}

/* Footer */
.footer{text-align:center;padding:32px 0 48px;font-size:12px;color:var(--text-3);border-top:1px solid var(--border);margin-top:20px}

@media(max-width:768px){
  .sidebar{width:180px}
  .sidebar-toggle.open{left:180px}
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-inner">
      <div class="logo"><div class="logo-icon">R</div><span>RayNews</span></div>
      <div class="header-right">
        <span><span class="status-dot"></span>实时更新</span>
        <span id="count">52 条新闻</span>
      </div>
    </div>
  </header>

  <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">☰</button>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">来源筛选</div>
    <div class="filters" id="filters"></div>
  </div>

  <div class="list" id="list"></div>
  <div class="footer">RayNews · 侧栏分类测试</div>
</div>

<script>
// Source category mapping (abbreviated names matching fetcher output)
const CATEGORY_MAP = {
  'News': ['竹新社', '风向旗参考快讯', '界面新闻', '即刻精选', '联合早报'],
  'Tech': ['凤凰网科技', 'cnBeta', '知识分子', '逛逛GitHub', '开源日记', '科技圈🎗在花频道📮', 'MacRumors', '少数派', '爱范儿', 'Chiphell', 'APPDO 数字生活指南', 'XP Digital Lab', 'RaysBlog', 'Yummy 😋', '阮一峰', '小声逼逼'],
  'Biz': ['金十数据', '格隆汇', '财经早餐', '凤凰网财经', '晚点', '投资界', '创业最前线', 'WBusiness商业', '包邮区', '理想生活实验室'],
  'Info': ['美卡指南', '蓝翼说', '酒店圈儿', '银探', '济南本地宝'],
};
const CATEGORY_ORDER = ['News', 'Tech', 'Biz', 'Info'];
let filter = 'all';

// Demo data: one article per source
const demoSources = Object.values(CATEGORY_MAP).flat();
const demoNews = demoSources.map((s, i) => ({
  id: 1000 + i,
  title: `[${s}] 测试文章标题 #${i + 1} — 用于验证分类筛选功能`,
  source: s,
  time: '12:' + String(i % 60).padStart(2, '0'),
  date: '2026-05-26',
  has_full_content: i % 3 === 0,
}));

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const toggle = document.getElementById('sidebarToggle');
  toggle.classList.toggle('open');
  toggle.textContent = sidebar.classList.toggle('open') ? '✕' : '☰';
}

function renderFilters() {
  const sources = [...new Set(demoNews.map(n => n.source))];
  const el = document.getElementById('filters');

  // "All" — uses identical HTML structure as category headers
  // (cat-header div + arrow span for layout parity)
  let html = '<div class="cat-header active" data-f="all" data-is-all="1">All<span class="arrow" style="opacity:0">▶</span></div>';

  for (const cat of CATEGORY_ORDER) {
    const catSources = CATEGORY_MAP[cat].filter(s => sources.includes(s));
    if (catSources.length === 0) continue;
    const collapsedKey = 'raynews_cat_' + cat;
    const isCollapsed = localStorage.getItem(collapsedKey) === '1';
    html += '<div class="cat-header" data-cat="' + cat + '">' + cat + '<span class="arrow ' + (isCollapsed ? '' : 'open') + '">▶</span></div>';
    html += '<div class="cat-body ' + (isCollapsed ? 'collapsed' : '') + '" data-cat="' + cat + '">';
    html += catSources.map(s => '<button class="fbtn" data-f="' + s + '">' + s + '</button>').join('');
    html += '</div>';
  }
  el.innerHTML = html;

  el.onclick = e => {
    // "All" click — checked first to prevent .cat-header overlap
    const allDiv = e.target.closest('[data-is-all]');
    if (allDiv) {
      selectFilter('all');
      return;
    }
    // Category header click
    const header = e.target.closest('.cat-header');
    if (header) {
      const cat = header.dataset.cat;
      const body = el.querySelector('.cat-body[data-cat="' + cat + '"]');
      const arrow = header.querySelector('.arrow');
      if (body) {
        const nowCollapsed = body.classList.toggle('collapsed');
        arrow.classList.toggle('open', !nowCollapsed);
        try { localStorage.setItem('raynews_cat_' + cat, nowCollapsed ? '1' : '0'); } catch(e) {}
      }
      selectFilter('cat:' + cat);
      return;
    }
    // Source button click
    const btn = e.target.closest('.fbtn');
    if (!btn) return;
    selectFilter(btn.dataset.f);
  };
}

function selectFilter(value) {
  const el = document.getElementById('filters');
  // Clear ALL selection classes from ALL elements
  el.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  el.querySelectorAll('.cat-header').forEach(h => h.classList.remove('active'));

  filter = value;
  renderList();

  if (value === 'all') {
    const allDiv = el.querySelector('[data-is-all]');
    if (allDiv) allDiv.classList.add('active');
  } else if (value.startsWith('cat:')) {
    const cat = value.replace('cat:', '');
    const header = el.querySelector('.cat-header[data-cat="' + cat + '"]');
    if (header) header.classList.add('active');
  } else {
    const btn = el.querySelector('.fbtn[data-f="' + value + '"]');
    if (btn) btn.classList.add('active');
  }
}

function renderList() {
  let filtered;
  if (filter === 'all') {
    filtered = demoNews;
  } else if (filter.startsWith('cat:')) {
    const cat = filter.replace('cat:', '');
    const sources = CATEGORY_MAP[cat] || [];
    filtered = demoNews.filter(n => sources.includes(n.source));
  } else {
    filtered = demoNews.filter(n => n.source === filter);
  }
  document.getElementById('count').textContent = filtered.length + ' 条新闻';
  const el = document.getElementById('list');
  if (!filtered.length) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-3)">该分类暂无新闻</div>';
    return;
  }
  el.innerHTML = filtered.map(n => '<div class="item"><div class="item-body"><div class="item-title">' + n.title + '</div><div class="item-meta"><span class="badge">' + n.source + '</span><span>' + n.time + '</span>' + (n.has_full_content ? '<span style="color:var(--accent);font-size:10px;font-weight:700">● 全文</span>' : '') + '</div></div></div>').join('');
}

renderFilters();
renderList();

// Click outside sidebar to close
document.addEventListener('click', e => {
  const sidebar = document.getElementById('sidebar');
  const toggle = document.getElementById('sidebarToggle');
  if (!sidebar.classList.contains('open')) return;
  if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
    sidebar.classList.remove('open');
    toggle.classList.remove('open');
    toggle.textContent = '☰';
  }
});
</script>
</body>
</html>
