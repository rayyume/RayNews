[supervisord]
nodaemon=true
pidfile=/run/supervisord.pid

[program:refresh]
command=/bin/bash -o pipefail -c 'python3 -u /app/refresh_server.py 2>&1 | python3 -u /app/timestamp_filter.py refresh'
user=raynews
environment=HOME="/home/raynews",USER="raynews"
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=/bin/bash -o pipefail -c 'python3 -u /app/web_server.py 2>&1 | python3 -u /app/timestamp_filter.py web'
user=raynews
environment=HOME="/home/raynews",USER="raynews"
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/bin/bash -o pipefail -c 'nginx -g "daemon off;" 2>&1 | python3 -u /app/timestamp_filter.py nginx'
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
