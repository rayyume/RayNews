[supervisord]
nodaemon=true
pidfile=/run/supervisord.pid

[program:refresh]
command=/bin/bash -o pipefail -c 'exec python3 -u /app/supervised_pipeline.py refresh -- python3 -u /app/refresh_server.py'
user=raynews
environment=HOME="/home/raynews",USER="raynews"
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=/bin/bash -o pipefail -c 'exec python3 -u /app/supervised_pipeline.py web -- python3 -u /app/web_server.py'
user=raynews
environment=HOME="/home/raynews",USER="raynews"
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/bin/bash -o pipefail -c 'exec python3 -u /app/supervised_pipeline.py nginx -- nginx -g "daemon off;"'
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
